<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATMI Workshop Overdrive</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#0a0a0a; color:#e0e0e0; font-family:'Segoe UI',sans-serif; display:flex; align-items:center; justify-content:center; }
  #box { text-align:center; max-width:500px; padding:30px; }
  h1 { font-size:2rem; color:#00e676; text-shadow:0 0 20px rgba(0,230,118,0.4); margin-bottom:8px; }
  .sub { color:#888; font-size:0.95rem; margin-bottom:30px; }
  .role-btn {
    display:block; width:100%; padding:18px; margin:12px 0; border-radius:12px;
    text-decoration:none; font-size:1.1rem; font-weight:700; transition:transform 0.1s;
  }
  .role-btn:hover { transform:scale(1.02); }
  .role-display { background:#00e676; color:#000; box-shadow:0 0 25px rgba(0,230,118,0.3); }
  .role-controller { background:#1a1a1a; color:#00e676; border:2px solid #00e676; box-shadow:0 0 15px rgba(0,230,118,0.1); }
  .hint { margin-top:24px; font-size:0.75rem; color:#555; line-height:1.6; }
  .qr { margin:16px auto; width:180px; height:180px; background:#fff; padding:8px; border-radius:8px; }
  .qr img { width:100%; height:100%; }
</style>
</head>
<body>
<div id="box">
  <h1>ATMI WORKSHOP<br>OVERDRIVE</h1>
  <div class="sub">Bengkel Otomasi — Politeknik Industri ATMI Cikarang</div>

  <a href="/display.html" class="role-btn role-display">📺 BUKA LAYAR DISPLAY (TV)</a>
  <a href="/controller.html" class="role-btn role-controller">📱 BUKA KONTROLER (HP)</a>

  <div class="hint">
    <strong>Cara pakai di booth:</strong><br>
    1. Laptop hubungkan ke TV → buka <em>Display</em><br>
    2. Pemain scan QR atau buka URL → pilih <em>Kontroler</em><br>
    3. Klik "MULAI SHIFT" di layar TV
  </div>
</div>
</body>
</html>
