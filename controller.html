<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="screen-orientation" content="landscape">
<title>ATMI Controller</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; touch-action:none; -webkit-user-select:none; user-select:none; }
  html, body { width:100%; height:100%; background:#0a0a0a; color:#fff; font-family:'Segoe UI',sans-serif; overflow:hidden; }
  #app { width:100%; height:100%; display:flex; flex-direction:row; align-items:center; justify-content:space-between; position:relative; padding:0 24px; }

  /* Status bar */
  #status { position:absolute; top:0; left:0; width:100%; padding:8px 16px; display:flex; justify-content:space-between; align-items:center; font-size:0.7rem; background:rgba(0,0,0,0.4); z-index:10; }
  #connStatus { display:flex; align-items:center; gap:6px; }
  #connDot { width:8px; height:8px; border-radius:50%; background:#ff5252; }
  #connDot.connected { background:#00e676; box-shadow:0 0 8px #00e676; }
  #playerBadge { padding:3px 10px; border-radius:12px; font-weight:700; font-size:0.65rem; background:rgba(255,255,255,0.1); }

  /* LEFT: Analog Joystick */
  #leftArea { display:flex; align-items:center; justify-content:center; flex:1; position:relative; }
  #joystick {
    position:relative; width:140px; height:140px; touch-action:none;
  }
  #joyBase {
    position:absolute; top:0; left:0; width:140px; height:140px;
    border:3px solid rgba(255,255,255,0.12); border-radius:50%;
    background:rgba(255,255,255,0.03);
  }
  #joyThumb {
    position:absolute; top:50%; left:50%; width:56px; height:56px;
    margin-top:-28px; margin-left:-28px;
    background:rgba(255,255,255,0.15); border:2px solid rgba(255,255,255,0.3);
    border-radius:50%; box-shadow:0 0 15px rgba(255,255,255,0.1);
    transition:none;
  }
  #joyThumb.active {
    background:rgba(0,230,118,0.25); border-color:#00e676;
    box-shadow:0 0 20px rgba(0,230,118,0.3);
  }

  /* CENTER: Item indicator */
  #centerArea { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; }
  #itemBox { display:flex; align-items:center; gap:8px; padding:10px 18px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:20px; font-size:0.85rem; color:#aaa; margin-bottom:8px; }
  #itemIcon { font-size:1.3rem; }

  /* RIGHT: Action buttons */
  #rightArea { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; flex:1; }
  #btnAction {
    width:100px; height:100px; border-radius:50%;
    background:rgba(0,230,118,0.15); border:3px solid #00e676;
    color:#00e676; font-size:0.95rem; font-weight:800; letter-spacing:0.5px;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    box-shadow:0 0 20px rgba(0,230,118,0.2);
  }
  #btnAction:active, #btnAction.active {
    background:rgba(0,230,118,0.35); box-shadow:0 0 30px rgba(0,230,118,0.4); transform:scale(0.95);
  }
  #btnAction span { font-size:0.65rem; opacity:0.7; margin-top:2px; }

  #btnDrop {
    width:64px; height:64px; border-radius:50%;
    background:rgba(255,82,82,0.12); border:2px solid #ff5252;
    color:#ff5252; font-size:0.7rem; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  #btnDrop:active, #btnDrop.active { background:rgba(255,82,82,0.3); transform:scale(0.95); }

  /* Connecting overlay */
  #overlay { position:absolute; inset:0; background:rgba(0,0,0,0.9); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; }
  #overlay.hidden { display:none; }
  #overlay h2 { color:#00e676; margin-bottom:10px; font-size:1.4rem; }
  #overlay p { color:#888; font-size:0.85rem; }

  /* Disconnect banner */
  #disconnectBanner { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#b71c1c; color:#fff; padding:12px 24px; border-radius:8px; font-weight:700; z-index:15; display:none; text-align:center; font-size:0.9rem; }

  /* Landscape hint for portrait users */
  #rotateHint { display:none; position:absolute; inset:0; background:#000; z-index:30; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:20px; }
  #rotateHint h2 { color:#00e676; margin-bottom:10px; }
  #rotateHint p { color:#888; font-size:0.85rem; }
  @media (orientation: portrait) and (max-width: 600px) {
    #rotateHint { display:flex; }
  }
</style>
</head>
<body>
<div id="rotateHint">
  <h2>📱 Putar HP Anda</h2>
  <p>Game ini dimainkan dalam mode <strong>landscape</strong>.<br>Silakan putar HP Anda ke posisi horizontal.</p>
</div>

<div id="app">
  <div id="status">
    <div id="connStatus"><div id="connDot"></div><span id="connText">Menyambung...</span></div>
    <div id="playerBadge">Menunggu...</div>
  </div>

  <div id="overlay">
    <h2>ATMI WORKSHOP</h2>
    <p>Menghubungkan ke server booth...</p>
  </div>

  <div id="disconnectBanner">Koneksi terputus.<br>Refresh halaman.</div>

  <div id="leftArea">
    <div id="joystick">
      <div id="joyBase"></div>
      <div id="joyThumb"></div>
    </div>
  </div>

  <div id="centerArea">
    <div id="itemBox">
      <span id="itemIcon">📭</span>
      <span id="itemText">Tangan kosong</span>
    </div>
  </div>

  <div id="rightArea">
    <div id="btnAction">AKSI<span>TAP/HOLD</span></div>
    <div id="btnDrop">BUANG</div>
  </div>
</div>

<script>
const wsUrl = 'ws://' + window.location.host + '/ws';
let ws = null;
let playerId = null;
let reconnectTimer = null;

const connDot = document.getElementById('connDot');
const connText = document.getElementById('connText');
const playerBadge = document.getElementById('playerBadge');
const overlay = document.getElementById('overlay');
const disconnectBanner = document.getElementById('disconnectBanner');
const itemIcon = document.getElementById('itemIcon');
const itemText = document.getElementById('itemText');

function vibrate(ms) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

function connect() {
  ws = new WebSocket(wsUrl + '/controller');

  ws.onopen = () => {
    connDot.classList.add('connected');
    connText.textContent = 'Terhubung';
    overlay.classList.add('hidden');
    disconnectBanner.style.display = 'none';
    clearTimeout(reconnectTimer);
  };

  ws.onmessage = (evt) => {
    try {
      const msg = JSON.parse(evt.data);
      if (msg.type === 'identity') {
        playerId = msg.playerId;
        playerBadge.textContent = `Pemain ${msg.playerId} - ${msg.name}`;
        playerBadge.style.background = msg.color + '22';
        playerBadge.style.color = msg.color;
        playerBadge.style.border = `1px solid ${msg.color}44`;
      }
      if (msg.type === 'item_update') {
        itemIcon.textContent = msg.icon || '📭';
        itemText.textContent = msg.text || 'Tangan kosong';
      }
      if (msg.type === 'haptic') {
        vibrate(msg.duration || 50);
      }
    } catch(e) {}
  };

  ws.onclose = () => {
    connDot.classList.remove('connected');
    connText.textContent = 'Terputus';
    overlay.classList.remove('hidden');
    disconnectBanner.style.display = 'block';
    reconnectTimer = setTimeout(connect, 2000);
  };

  ws.onerror = () => {
    ws.close();
  };
}

connect();

// Input state (analog + buttons)
const input = { dx:0, dy:0, action:false, drop:false };

function sendInput() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ ...input }));
  }
}

function setBtn(key, active) {
  input[key] = active;
  sendInput();
}

function bindBtn(el, key) {
  el.addEventListener('touchstart', (e) => { e.preventDefault(); setBtn(key, true); vibrate(20); }, {passive:false});
  el.addEventListener('touchend', (e) => { e.preventDefault(); setBtn(key, false); });
  el.addEventListener('touchcancel', (e) => { setBtn(key, false); });
  el.addEventListener('mousedown', (e) => { e.preventDefault(); setBtn(key, true); });
  el.addEventListener('mouseup', (e) => { e.preventDefault(); setBtn(key, false); });
  el.addEventListener('mouseleave', (e) => { setBtn(key, false); });
}

bindBtn(document.getElementById('btnAction'), 'action');
bindBtn(document.getElementById('btnDrop'), 'drop');

// Analog Joystick
const joystick = document.getElementById('joystick');
const joyThumb = document.getElementById('joyThumb');
const JOY_MAX = 70; // half of base width minus thumb radius allowance
let joyActive = false;
let joyCenterX = 0, joyCenterY = 0;

function updateJoystick(clientX, clientY) {
  const rect = joystick.getBoundingClientRect();
  joyCenterX = rect.left + rect.width / 2;
  joyCenterY = rect.top + rect.height / 2;
  let x = clientX - joyCenterX;
  let y = clientY - joyCenterY;
  const dist = Math.sqrt(x*x + y*y);
  if (dist > JOY_MAX) {
    x = x / dist * JOY_MAX;
    y = y / dist * JOY_MAX;
  }
  joyThumb.style.transform = `translate(${x}px, ${y}px)`;
  input.dx = x / JOY_MAX;
  input.dy = y / JOY_MAX;
  sendInput();
}

function resetJoystick() {
  joyThumb.style.transform = 'translate(0px, 0px)';
  joyThumb.classList.remove('active');
  input.dx = 0;
  input.dy = 0;
  joyActive = false;
  sendInput();
}

joystick.addEventListener('touchstart', (e) => {
  e.preventDefault();
  joyActive = true;
  joyThumb.classList.add('active');
  updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
}, {passive:false});

joystick.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (joyActive) updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
}, {passive:false});

joystick.addEventListener('touchend', (e) => {
  e.preventDefault();
  resetJoystick();
});

joystick.addEventListener('touchcancel', (e) => {
  resetJoystick();
});

joystick.addEventListener('mousedown', (e) => {
  e.preventDefault();
  joyActive = true;
  joyThumb.classList.add('active');
  updateJoystick(e.clientX, e.clientY);
});

window.addEventListener('mousemove', (e) => {
  if (joyActive) updateJoystick(e.clientX, e.clientY);
});

window.addEventListener('mouseup', (e) => {
  if (joyActive) resetJoystick();
});

// Prevent sleep
if ('wakeLock' in navigator) {
  navigator.wakeLock.request('screen').catch(() => {});
}
</script>
</body>
</html>
